<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>शिक्षक व शाळा नोंदवही पोर्टल</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16303F;
    --navy-2:#1F435A;
    --paper:#F6F1E4;
    --paper-2:#EEE6D2;
    --card:#FFFEFA;
    --ink:#241F17;
    --ink-soft:#5B5546;
    --line:#D9CDAE;
    --maroon:#8A2E3B;
    --maroon-dark:#6E202B;
    --gold:#A9781F;
    --green:#2E6B4E;
    --green-bg:#E4EFE7;
    --amber:#9C6B14;
    --amber-bg:#F4EAD2;
    --red:#8A2E3B;
    --red-bg:#F3E2E2;
    --radius:3px;
    --shadow:0 1px 2px rgba(22,48,63,.08), 0 4px 14px rgba(22,48,63,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans Devanagari','Noto Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold);color:#fff;}

  /* ---------- Letterhead ---------- */
  .letterhead{
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
    color:#F3EEDF;
    padding:18px 20px 16px;
    border-bottom:4px solid var(--gold);
    position:relative;
  }
  .letterhead-inner{
    max-width:1180px;margin:0 auto;
    display:flex;align-items:center;gap:14px;justify-content:space-between;
    flex-wrap:wrap;
  }
  .lh-title-block{display:flex;align-items:center;gap:12px;min-width:0;}
  .seal{
    width:46px;height:46px;flex:0 0 auto;border-radius:50%;
    border:2px solid #D8C088;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, #2A5069, #16303F);
    font-family:'Noto Serif',serif;font-weight:700;color:#E9CE8E;font-size:18px;
  }
  .lh-text h1{
    font-family:'Noto Sans Devanagari','Noto Serif',serif;
    font-size:19px;line-height:1.35;margin:0;font-weight:700;letter-spacing:.2px;
  }
  .lh-text p{margin:2px 0 0;font-size:12.5px;color:#C9D4D9;font-family:'Noto Serif',serif;font-style:italic;}
  .lh-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .admin-pill{
    display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.2);padding:6px 10px;border-radius:20px;font-size:12.5px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#7FBE95;}
  
  /* ---------- Buttons ---------- */
  .btn{
    font-family:inherit;cursor:pointer;border:none;border-radius:var(--radius);
    padding:8px 14px;font-size:13.5px;font-weight:600;letter-spacing:.2px;
    transition:transform .08s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-gold{background:var(--gold);color:#241905;}
  .btn-gold:hover{background:#BC8A2C;}
  .btn-outline-light{background:transparent;color:#F3EEDF;border:1px solid rgba(255,255,255,.4);}
  .btn-outline-light:hover{background:rgba(255,255,255,.1);}
  .btn-maroon{background:var(--maroon);color:#fff;}
  .btn-maroon:hover{background:var(--maroon-dark);}
  .btn-navy{background:var(--navy);color:#F3EEDF;}
  .btn-navy:hover{background:var(--navy-2);}
  .btn-ghost{background:transparent;color:var(--navy);border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn-danger:hover{background:var(--red-bg);}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  /* ---------- Tabs ---------- */
  .tabbar{
    background:var(--card);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:20;
  }
  .tabbar-inner{max-width:1180px;margin:0 auto;display:flex;gap:2px;padding:0 20px;overflow-x:auto;}
  .tab-btn{
    background:none;border:none;font-family:inherit;cursor:pointer;
    padding:13px 16px 11px;font-size:14px;font-weight:600;color:var(--ink-soft);
    border-bottom:3px solid transparent;white-space:nowrap;
  }
  .tab-btn.active{color:var(--maroon);border-bottom-color:var(--maroon);}

  /* ---------- Layout ---------- */
  .wrap{max-width:1180px;margin:0 auto;padding:20px;}
  .hidden{display:none !important;}

  h2.section-title{
    font-family:'Noto Serif',serif;font-weight:700;font-size:19px;color:var(--navy);
    margin:0 0 3px;
  }
  p.section-sub{margin:0 0 16px;color:var(--ink-soft);font-size:13px;}

  /* ---------- Dashboard ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--navy);
  }
  .stat-card .num{font-family:'Noto Serif',serif;font-size:26px;font-weight:700;color:var(--navy);}
  .stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:18px;}
  .panel h3{margin:0 0 12px;font-size:14.5px;color:var(--navy);font-family:'Noto Serif',serif;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px;}
  .bar-row .bar-label{width:110px;flex:0 0 auto;color:var(--ink-soft);}
  .bar-track{flex:1;background:var(--paper-2);border-radius:8px;height:14px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:8px;}
  .bar-row .bar-val{width:44px;text-align:right;font-weight:600;color:var(--ink);}

  /* ---------- Toolbar / filters ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
  .input, select.input{
    font-family:inherit;border:1px solid var(--line);background:var(--card);
    padding:8px 10px;border-radius:var(--radius);font-size:13.5px;color:var(--ink);
  }
  .input:focus, select.input:focus{outline:2px solid #C9AE6E;outline-offset:0;border-color:var(--gold);}
  .search-input{flex:1;min-width:180px;}
  .spacer{flex:1;}
  .result-count{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}

  /* ---------- Table ---------- */
  .table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);}
  table.data{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
  table.data thead th{
    text-align:left;background:var(--navy);color:#EFE9D8;padding:10px 12px;
    font-weight:600;font-size:12.5px;position:sticky;top:0;
  }
  table.data tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.data tbody tr:hover{background:var(--paper-2);}
  table.data tbody tr:last-child td{border-bottom:none;}
  .muted{color:var(--ink-soft);}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;}
  .badge-green{background:var(--green-bg);color:var(--green);}
  .badge-amber{background:var(--amber-bg);color:var(--amber);}
  .badge-red{background:var(--red-bg);color:var(--red);}
  .badge-blue{background:#DCE6EE;color:#3B6EA5;}
  .badge-gray{background:#E0E0E0;color:#555;}
  .badge-purple{background:#F3E5F5;color:#8E44AD;}
  
  .row-actions{display:flex;gap:6px;white-space:nowrap;}
  .pagination{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:14px;flex-wrap:wrap;}
  .page-info{font-size:12.5px;color:var(--ink-soft);margin:0 8px;}

  /* ---------- School cards ---------- */
  .school-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
  .school-card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .12s, opacity .2s;
  }
  .school-card:hover{border-color:var(--gold);}
  .school-card.school-hidden { opacity: 0.55; background: #EFEFEF; }
  .school-card h4{margin:0 0 6px;font-size:14.5px;color:var(--navy);line-height:1.35;font-family:'Noto Serif',serif;}
  .school-card .meta{font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .school-card .badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
  .mini-badge{font-size:10.5px;padding:1px 7px;border-radius:10px;font-weight:600;}
  .s-num { color:var(--maroon); font-weight:700; margin-right:4px; font-size:15px; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,30,35,.55);
    display:flex;align-items:flex-start;justify-content:center;
    padding:26px 14px;overflow-y:auto;z-index:100;
  }
  .modal{
    background:var(--paper);border-radius:6px;max-width:560px;width:100%;
    box-shadow:0 20px 50px rgba(0,0,0,.35);border-top:5px solid var(--gold);
    animation:pop .12s ease-out;
  }
  @keyframes pop{from{transform:translateY(6px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;}
  .modal-head h3{margin:0;font-family:'Noto Serif',serif;font-size:17px;color:var(--navy);}
  .modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:4px;}
  .modal-body{padding:6px 18px 18px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:4px;}
  .field .input{width:100%;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .custom-row{display:flex;gap:8px;margin-bottom:8px;}
  .custom-row .input{flex:1;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
  .helptext{font-size:12px;color:var(--ink-soft);margin:-2px 0 10px;}
  .divider{border:none;border-top:1px solid var(--line);margin:14px 0;}

  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}
  .empty-state .big{font-size:30px;margin-bottom:8px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#F3EEDF;padding:10px 18px;border-radius:6px;
    font-size:13.5px;box-shadow:var(--shadow);z-index:200;opacity:0;transition:opacity .2s, bottom .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;bottom:30px;}
  footer.foot{text-align:center;padding:26px 14px 34px;color:var(--ink-soft);font-size:12px;}

  @media (max-width:600px){
    .lh-text h1{font-size:16px;}
    .bar-row .bar-label{width:90px;font-size:12px;}
    .field-row{flex-direction:column;gap:0;}
  }

  /* ---------- Print Styles ---------- */
  @media print {
    body > :not(#printArea) { display: none !important; } 
    
    #printArea { display: block !important; position: static; width: 100%; padding: 0; background: #fff; color: #000; font-family: sans-serif; }
    
    #printArea h2 { margin: 0 0 5px; font-size: 22px; text-align: center; }
    #printArea .print-sub { text-align: center; font-size: 14px; margin-bottom: 20px; }
    
    #printArea table { width: 100%; border-collapse: collapse; font-size: 11pt; margin-top: 10px; page-break-inside: auto; }
    #printArea th, #printArea td { border: 1px solid #000; padding: 6px 8px; text-align: left; }
    #printArea th { background-color: #f2f2f2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    
    #printArea .header-table { border: none; border-bottom: 2px solid #000; margin-bottom: 15px; padding-bottom: 10px; }
    #printArea .header-table td { border: none; padding: 4px; }
    
    #printArea thead { display: table-header-group; }
    #printArea tfoot { display: table-footer-group; }
    #printArea tr { page-break-inside: avoid; break-inside: avoid; }
    
    @page { margin: 15mm; }
  }
</style>
</head>

/* =========================================================
   STORAGE & SYNC
   ========================================================= */
function normalizeRecord(r){
  let st = r.status;
  if(st === 'Active') st = 'उपस्थित';
  if(!STATUS_OPTS.includes(st)) st = 'उपस्थित';

  return {
    id: r.id || uid(),
    brc: r.brc || 'AMBAJOGAI',
    school: r.school || '',
    udise: (r.udise!==undefined && r.udise!==null) ? String(r.udise) : '',
    teacher: r.teacher || '',
    status: st,
    custom: (r.custom && typeof r.custom === 'object') ? r.custom : {}
  };
}

async function loadDB(){
  try{
    const res = localStorage.getItem('teachers-db');
    if(res) DB = JSON.parse(res);
  }catch(e){ console.error(e); }
  
  if(!DB || !DB.length) DB = SEED_DATA.map(r => normalizeRecord(r));
  else DB = DB.map(r => normalizeRecord(r)); 

  try {
    const hs = localStorage.getItem('hidden-schools');
    if(hs) hiddenSchools = JSON.parse(hs);
    
    const hSet = localStorage.getItem('header-settings');
    if(hSet) headerSettings = JSON.parse(hSet);
  } catch(e){}

  renderHeaderText();
}

async function syncDB() {
  try{
    const res = await fetch(SCRIPT_URL + '?action=list', { cache: 'no-store' });
    const json = await res.json();
    if(json.ok && json.data && json.data.length){
      DB = json.data.map(normalizeRecord);
      await saveDB();
      render(); 
    }
  }catch(e){
    // Background sync silently fails if offline, which is fine.
  }
}

async function saveDB(){
  try{
    localStorage.setItem('teachers-db', JSON.stringify(DB));
  }catch(e){
    showToast('जतन करताना त्रुटी आली');
  }
}

async function getAdminPassword(){ return localStorage.getItem('admin-password'); }
async function setAdminPassword(pw){ localStorage.setItem('admin-password', pw); }
function saveHeaderSettings(s){
  headerSettings = s;
  localStorage.setItem('header-settings', JSON.stringify(s));
  renderHeaderText();
}
function renderHeaderText(){
  document.getElementById('headerTitle').textContent = headerSettings.title;
  let subText = headerSettings.sub;
  if(headerSettings.venue) subText += " | " + headerSettings.venue;
  if(headerSettings.date) subText += " | " + headerSettings.date;
  document.getElementById('headerSub').textContent = subText;
}

/* =========================================================
   HELPERS
   ========================================================= */
function uid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toastRoot');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2400);
}
function badgeClass(status){
  if(status==='उपस्थित') return 'badge-green';
  if(status==='गैरहजर') return 'badge-red';
  if(status==='किरकोळ रजा') return 'badge-amber';
  if(status==='अर्जित रजा') return 'badge-blue';
  if(status==='वैद्यकीय रजा') return 'badge-purple';
  if(status==='इतर') return 'badge-gray';
  return 'badge-amber';
}
function statusLabel(status){ return STATUS_LABEL_MR[status] || status || '—'; }

function uniqueSchools(){
  const map = new Map();

  Object.entries(SCHOOL_META).forEach(([udise, meta]) => {
    map.set(udise, {
        key: udise,
        school: meta.school,
        udise: udise,
        brc: 'AMBAJOGAI', 
        teachers: [],
        mgt: meta.mgt || 'इतर (Other)',
        hm: meta.hm || 'उपलब्ध नाही',
        phone: meta.phone || '-',
        cls: meta.cls || '-'
    });
  });

  DB.forEach(r => {
    let key = (r.udise && map.has(r.udise)) ? r.udise : (r.school + '||' + (r.udise||''));
    if(!map.has(key)) {
        map.set(key, {
            key: key,
            school: r.school,
            udise: r.udise,
            brc: r.brc,
            teachers: [],
            mgt: 'इतर (Other)',
            hm: 'उपलब्ध नाही',
            phone: '-',
            cls: '-'
        });
    }
    map.get(key).teachers.push(r);
  });

  let schoolsArr = Array.from(map.values())
    .filter(s => isAdmin || !hiddenSchools.includes(s.key));

  return schoolsArr;
}

function allBrcs(){ return Array.from(new Set(DB.map(r=>r.brc).filter(Boolean))).sort(); }
function customKeysFor(list){
  const keys = new Set();
  list.forEach(r=>{ if(r.custom) Object.keys(r.custom).forEach(k=>keys.add(k)); });
  return Array.from(keys);
}

function getDropdownLists(schoolsList){
  const allM = new Set();
  const allC = new Set();
  schoolsList.forEach(s => {
    if(s.mgt) allM.add(s.mgt);
    if(s.cls) allC.add(s.cls);
  });
  return { mgtList: Array.from(allM).sort(), clsList: Array.from(allC).sort() };
}

          </div>
        </div>
      </div>

    const p1=document.getElementById('npw1').value, p2=document.getElementById('npw2').value;

function bindClose(ids){
  ids.forEach(id=>{
    const e = document.getElementById(id);
    if(e) e.onclick = (ev)=>{ if(ev.target.id===id) closeModal(); };
  });
}

function openTeacherForm(record){
  const isEdit = !!record;
  const r = record || {id:null, brc:(allBrcs()[0]||'AMBAJOGAI'), school:'', udise:'', teacher:'', status:'उपस्थित', custom:{}};
  const root = document.getElementById('modalRoot');
  const customEntries = Object.entries(r.custom||{});
  root.innerHTML = `
    <div class="overlay" id="ov">
      <div class="modal">
        <div class="modal-head"><h3>${isEdit? 'शिक्षक माहिती संपादित करा':'नवीन शिक्षक जोडा'}</h3><button class="modal-close" id="mc">×</button></div>
        <div class="modal-body">
          <div class="field-row">

            <div class="field"><label>UDISE क्रमांक</label><input class="input" id="f_udise" value="${esc(r.udise)}"></div>
          </div>
          <div class="field"><label>शाळेचे नाव</label><input class="input" id="f_school" value="${esc(r.school)}"></div>
          <div class="field"><label>शिक्षकाचे नाव</label><input class="input" id="f_teacher" value="${esc(r.teacher)}"></div>

              ${STATUS_OPTS.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${statusLabel(s)}</option>`).join('')}
            </select>
          </div>
          <hr class="divider">
          <label style="font-size:12.5px;font-weight:600;color:var(--ink-soft);">अतिरिक्त तपशील (पर्यायी)</label>
          <div id="customRows">
            ${customEntries.map(([k,v])=>customRowHtml(k,v)).join('')}
          </div>
          <button class="btn btn-ghost btn-sm" id="addCustomRow">+ क्षेत्र जोडा</button>
          <div class="modal-actions" style="margin-top:20px;">
            <button class="btn btn-ghost" id="cancel">रद्द करा</button>
            ${isEdit? `<button class="btn btn-danger" id="delBtn">नोंद काढून टाका</button>`:''}
            <button class="btn btn-maroon" id="saveBtn">जतन करा</button>
          </div>
        </div>
      </div>
    </div>`;
  bindClose(['ov','mc','cancel']);
  document.getElementById('addCustomRow').onclick = ()=>{
    document.getElementById('customRows').insertAdjacentHTML('beforeend', customRowHtml('',''));
  };
  document.getElementById('customRows').addEventListener('click', (e)=>{
    if(e.target.classList.contains('rm-row')) e.target.closest('.custom-row').remove();
  });
  
  if(isEdit){
    document.getElementById('delBtn').onclick = async ()=>{
      if(!confirm('ही नोंद कायमची डिलीट करायची आहे का?')) return;
      DB = DB.filter(x=>x.id!==r.id);
      await saveDB(); closeModal(); render(); showToast('नोंद यशस्वीरित्या काढली');
      try{ 
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action:'delete', id:r.id}) }); 
      } catch(e){}
    };
  }
  
  document.getElementById('saveBtn').onclick = async ()=>{
    const brc = document.getElementById('f_brc').value.trim();
    const udise = document.getElementById('f_udise').value.trim();
    const school = document.getElementById('f_school').value.trim();
    const teacher = document.getElementById('f_teacher').value.trim();
    const status = document.getElementById('f_status').value;
    if(!school || !teacher){ showToast('शाळेचे नाव व शिक्षकाचे नाव आवश्यक आहे'); return; }
    
    const custom = {};
    document.querySelectorAll('#customRows .custom-row').forEach(row=>{
      const k = row.querySelector('.ck').value.trim();
      const v = row.querySelector('.cv').value.trim();
      if(k) custom[k]=v;
    });
    
    let rec;
    if(isEdit){
      const idx = DB.findIndex(x=>x.id===r.id);
      DB[idx] = {...DB[idx], brc,udise,school,teacher,status,custom};
      rec = DB[idx];
    }else{
      rec = {id:uid(), brc,udise,school,teacher,status,custom};
      DB.push(rec);
    }
    
    await saveDB(); closeModal(); render();
    showToast(isEdit? 'माहिती अद्ययावत झाली':'नवीन शिक्षक जोडला');
    try{ 
      fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({action:'upsert', record:rec}) }); 
    }catch(e){}
  };
}

function triggerPrintDialog(htmlContent, documentTitle) {
  const printArea = document.getElementById('printArea');

  document.title = documentTitle;

    printArea.innerHTML = '';

}

function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===state.tab));
  const app = document.getElementById('app');
  if(state.tab==='dashboard') app.innerHTML = renderDashboard();
  else if(state.tab==='teachers') app.innerHTML = renderTeachersTab();
  else if(state.tab==='schools') app.innerHTML = renderSchoolsTab();
  attachHandlers();
}

function renderDashboard(){
  let schools = uniqueSchools();
  let totalTeachers = 0;
  const byStatus = {};
  STATUS_OPTS.forEach(s=>byStatus[s]=0);
  
  schools.forEach(s => {
      s.teachers.forEach(r => {
          totalTeachers++;
          byStatus[r.status] = (byStatus[r.status]||0)+1;
      });
  });

  const totalSchools = schools.length;
  const maxC = Math.max(1,...Object.values(byStatus));
  
  return `
    <h2 class="section-title">विहंगावलोकन</h2>
    <p class="section-sub">${headerSettings.title} — एकूण नोंदवही स्थिती</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${totalTeachers}</div><div class="lbl">एकूण शिक्षक</div></div>
      <div class="stat-card"><div class="num">${totalSchools}</div><div class="lbl">एकूण शाळा</div></div>
      ${STATUS_OPTS.map(s=>`<div class="stat-card" style="border-top-color:${STATUS_COLOR[s]};"><div class="num" style="color:${STATUS_COLOR[s]};">${byStatus[s]}</div><div class="lbl">${statusLabel(s)}</div></div>`).join('')}
    </div>
    <div class="panel">
      <h3>स्थितीनुसार विभागणी</h3>
      ${STATUS_OPTS.map(s=>{
        const v = byStatus[s]; const pct = Math.round((v/maxC)*100);
        return `<div class="bar-row">
          <div class="bar-label">${statusLabel(s)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}\%;background:${STATUS_COLOR[s]};"></div></div>
          <div class="bar-val">${v}</div>
        </div>`;
      }).join('')}
    </div>
    
    ${isAdmin ? `
    <div class="panel">
      <h3>त्वरित कृती (प्रशासक)</h3>
      <div class="toolbar" style="margin-bottom:0;">
        <button class="btn btn-navy" id="dashAddTeacher">+ नवीन शिक्षक जोडा</button>
        <button class="btn btn-ghost" id="dashExportAll">🖨️ संपूर्ण यादी प्रिंट करा</button>
      </div>
    </div>` : ''}
  `;
}

    if(state.teacherSearch){
      const q = state.teacherSearch.toLowerCase();
      if(!(r.teacher.toLowerCase().includes(q) || r.school.toLowerCase().includes(q) || (r.udise||'').includes(q))) return false;
    }
    return true;

  const total = list.length;

      </select>

        <option value="">सर्व BRC</option>
        ${brcs.map(b=>`<option value="${esc(b)}" ${state.teacherBrc===b?'selected':''}>${esc(b)}</option>`).join('')}
      </select>`:''}
      <div class="spacer"></div>
      ${isAdmin ? `
        <button class="btn btn-ghost" id="exportFilteredPdf">🖨️ फिल्टर केलेली यादी प्रिंट करा</button>
        <button class="btn btn-navy" id="addTeacherBtn">+ नवीन शिक्षक</button>

    <div class="result-count">${total} पैकी ${pageList.length} नोंदी दाखवत आहे</div>

    <div class="table-scroll">
      <table class="data">
        <thead>
          <tr>
            <th>अ.क्र.</th>
            <th>शाळा</th>
            <th>शिक्षकाचे नाव</th>
            <th>स्थिती</th>
            ${isAdmin ? '<th>कृती</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${pageList.map((r,i)=>`
            <tr>
              <td>${startIdx+i+1}</td>
              <td>${esc(r.school)}<br><span class="muted" style="font-size:11.5px;">UDISE: ${esc(r.udise)||'—'}</span></td>
              <td>${esc(r.teacher)}</td>
              <td><span class="badge ${badgeClass(r.status)}">${statusLabel(r.status)}</span></td>

              <td class="row-actions">

    </div>`}
  `;
}

function renderSchoolsTab(){
  let schools = uniqueSchools();
  const lists = getDropdownLists(schools);

  // Filter
  schools = schools.filter(s => {
    if(state.schoolSearch){
      const q = state.schoolSearch.toLowerCase();
      if(!(s.school.toLowerCase().includes(q) || (s.udise||'').includes(q))) return false;
    }
    if(state.schoolMgt && s.mgt !== state.schoolMgt) return false;
    if(state.schoolCls && s.cls !== state.schoolCls) return false;
    return true;
  });

  // Sort with safe string checks
  schools.sort((a,b) => {
    const mgtA = String(a.mgt || '');
    const mgtB = String(b.mgt || '');
    const clsA = String(a.cls || '');
    const clsB = String(b.cls || '');
    const schoolA = String(a.school || '');
    const schoolB = String(b.school || '');

    if(state.schoolSort === 'mgt') return mgtA.localeCompare(mgtB) || schoolA.localeCompare(schoolB);
    if(state.schoolSort === 'cls') return clsA.localeCompare(clsB) || schoolA.localeCompare(schoolB);
    return schoolA.localeCompare(schoolB);
  });

  if(state.openSchool){
    const info = schools.find(s => s.key === state.openSchool);
    if(info) return renderSchoolDetail(info);
    state.openSchool = null; 
  }

  return `
    <h2 class="section-title">शाळानिहाय यादी</h2>
    <p class="section-sub">${schools.length} शाळा उपलब्ध</p>
    <div class="toolbar">
      <input class="input search-input" id="sSearch" placeholder="शाळा किंवा UDISE शोधा…" value="${esc(state.schoolSearch)}">
      
      <select class="input" id="sMgt">
        <option value="">सर्व व्यवस्थापन (All Management)</option>
        ${lists.mgtList.map(m => `<option value="${esc(m)}" ${state.schoolMgt===m?'selected':''}>${esc(m)}</option>`).join('')}
      </select>
      
      <select class="input" id="sCls">
        <option value="">सर्व इयत्ता (All Classes)</option>
        ${lists.clsList.map(c => `<option value="${esc(c)}" ${state.schoolCls===c?'selected':''}>${esc(c)}</option>`).join('')}
      </select>
      
      <select class="input" id="sSort">
        <option value="name" ${state.schoolSort==='name'?'selected':''}>नावानुसार (By Name)</option>
        <option value="mgt" ${state.schoolSort==='mgt'?'selected':''}>व्यवस्थापनानुसार (By Management)</option>
        <option value="cls" ${state.schoolSort==='cls'?'selected':''}>इयत्तेनुसार (By Class)</option>
      </select>
    </div>
    
    <div class="school-grid">
      ${schools.map((s, index)=>{
        const isHidden = hiddenSchools.includes(s.key);
        const counts = {}; STATUS_OPTS.forEach(k=>counts[k]=0);
        s.teachers.forEach(t=>counts[t.status]=(counts[t.status]||0)+1);
        return `<div class="school-card ${isHidden ? 'school-hidden' : ''}" data-key="${esc(s.key)}">
          <h4><span class="s-num">#${index + 1}</span> ${esc(s.school)}${isHidden ? ' 🚫' : ''}</h4>
          
          <div class="meta" style="margin-bottom:6px; color:var(--navy);">
            <strong>Mgt:</strong> ${esc(s.mgt)} &nbsp;\vert{}&nbsp; <strong>Class:</strong>${esc(s.cls)}
          </div>
          <div class="meta" style="margin-bottom:6px;">
            <strong>HM:</strong> ${esc(s.hm)} (☎${esc(s.phone)})
          </div>
          
          <div class="meta" style="border-top:1px dashed var(--line); padding-top:6px;">
             UDISE: ${esc(s.udise)||'—'} · BRC: ${esc(s.brc)\vert{}\vert{}'—'} · <b>${s.teachers.length} शिक्षक</b>
          </div>
          
          <div class="badges">
            ${STATUS_OPTS.map(k=> counts[k]? `<span class="mini-badge ${badgeClass(k)}">${statusLabel(k)} ${counts[k]}</span>`:'').join('')}
          </div>
        </div>`;
      }).join('')}
    </div>
    ${schools.length===0?`<div class="empty-state"><div class="big">—</div>कोणतीही शाळा आढळली नाही</div>`:''}
  `;
}

function renderSchoolDetail(info){
  const customCols = customKeysFor(info.teachers);
  const isHidden = hiddenSchools.includes(info.key);
  const colspanLength = 3 + customCols.length + (isAdmin ? 1 : 0);

  return `
    <button class="btn btn-ghost btn-sm" id="backToSchools" style="margin-bottom:14px;">‹ सर्व शाळांकडे परत जा</button>
    <div class="panel" style="margin-bottom:16px;">
      <h2 class="section-title" style="margin-bottom:8px;">${esc(info.school)}</h2>
      <p class="section-sub" style="margin-bottom:6px; color:var(--navy);">
        <strong>Management:</strong> ${esc(info.mgt)} &nbsp;·&nbsp; <strong>Class:</strong> ${esc(info.cls)}
      </p>
      <p class="section-sub" style="margin-bottom:12px;">
        <strong>HM:</strong> ${esc(info.hm)} (${esc(info.phone)}) <br>
        UDISE: ${esc(info.udise)||'—'} &nbsp;·&nbsp; BRC: ${esc(info.brc)||'—'} &nbsp;·&nbsp; एकूण शिक्षक: <b>${info.teachers.length}</b>
      </p>
      
      ${isAdmin ? `
      <div class="toolbar" style="margin-bottom:0;">
        <button class="btn btn-maroon" id="printSchoolBtn">🖨️ यादी प्रिंट करा</button>
        <button class="btn btn-navy" id="addTeacherToSchool">+ शिक्षक जोडा</button>
        <button class="btn btn-outline-light" style="color:var(--ink); border-color:var(--line);" id="toggleSchoolHide">
           ${isHidden ? '👁️ ही शाळा पब्लिकला दाखवा' : '🚫 ही शाळा पब्लिकपासून लपवा'}
        </button>
      </div>` : ''}
    </div>
    <div class="table-scroll">
      <table class="data">
        <thead>
          <tr>
             <th>अ.क्र.</th>
             <th>शिक्षकाचे नाव</th>
             <th>स्थिती</th>
             ${customCols.map(c=>`<th>${esc(c)}</th>`).join('')}
             ${isAdmin ? '<th>कृती</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${info.teachers.length === 0 ? `<tr><td colspan="${colspanLength}" style="text-align:center; padding: 20px; color: var(--ink-soft);">सध्या या शाळेत कोणतीही नोंद नाही.</td></tr>` : 
            info.teachers.map((t,i)=>`
            <tr>
              <td>${i+1}</td>
              <td>${esc(t.teacher)}</td>
              <td><span class="badge ${badgeClass(t.status)}">${statusLabel(t.status)}</span></td>${customCols.map(c=>`<td>${esc((t.custom&&t.custom[c])||'—')}</td>`).join('')}
              ${isAdmin ? `<td><button class="btn btn-ghost btn-sm edit-row" data-id="${t.id}">संपादन</button></td>` : ''}
            </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

/* =========================================================
   EVENT WIRING
   ========================================================= */
function attachHandlers(){
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{ state.tab=b.dataset.tab; state.openSchool=null; render(); };
  });

  if(state.tab==='dashboard'){
    const a = document.getElementById('dashAddTeacher');
    if(a) a.onclick = ()=> openTeacherForm(null);
    const e = document.getElementById('dashExportAll');
    if(e) e.onclick = ()=> {
       let list = DB.filter(r => {
           let cardKey = r.udise && SCHOOL_META[r.udise] ? r.udise : (r.school + '||' + (r.udise||''));
           return !hiddenSchools.includes(cardKey);
       });
       printFullInfo(list, 'Teacher Register');
    };
  }

  if(state.tab==='teachers'){
    const s = document.getElementById('tSearch');
    if(s){ s.oninput = ()=>{ state.teacherSearch=s.value; state.teacherPage=1; render(); }; }
    const st = document.getElementById('tStatus');
    if(st){ st.onchange = ()=>{ state.teacherStatus=st.value; state.teacherPage=1; render(); }; }
    const br = document.getElementById('tBrc');
    if(br){ br.onchange = ()=>{ state.teacherBrc=br.value; state.teacherPage=1; render(); }; }
    const add = document.getElementById('addTeacherBtn');
    if(add) add.onclick = ()=> openTeacherForm(null);
    
    const exp = document.getElementById('exportFilteredPdf');
    if(exp) exp.onclick = ()=>{
      let list = DB.filter(r=>{
        let cardKey = r.udise && SCHOOL_META[r.udise] ? r.udise : (r.school + '||' + (r.udise||''));
        if(!isAdmin && hiddenSchools.includes(cardKey)) return false;
        if(state.teacherStatus && r.status!==state.teacherStatus) return false;
        if(state.teacherBrc && r.brc!==state.teacherBrc) return false;
        if(state.teacherSearch){
          const q=state.teacherSearch.toLowerCase();
          if(!(r.teacher.toLowerCase().includes(q) || r.school.toLowerCase().includes(q) || (r.udise||'').includes(q))) return false;
        }
        return true;
      });
      printFullInfo(list, 'Filtered List');
    };
    
    document.querySelectorAll('.edit-row').forEach(btn=>{
      btn.onclick = ()=> {
        const rec = DB.find(x=>x.id===btn.dataset.id);
        openTeacherForm(rec);
      };
    });
    const prev = document.getElementById('prevPage');
    if(prev) prev.onclick = ()=>{ state.teacherPage--; render(); };
    const next = document.getElementById('nextPage');
    if(next) next.onclick = ()=>{ state.teacherPage++; render(); };
  }

  if(state.tab==='schools'){
    const sSearch = document.getElementById('sSearch');
    if(sSearch){ sSearch.oninput = ()=>{ state.schoolSearch=sSearch.value; render(); }; }
    
    const sMgt = document.getElementById('sMgt');
    if(sMgt){ sMgt.onchange = ()=>{ state.schoolMgt=sMgt.value; render(); }; }
    
    const sCls = document.getElementById('sCls');
    if(sCls){ sCls.onchange = ()=>{ state.schoolCls=sCls.value; render(); }; }
    
    const sSort = document.getElementById('sSort');
    if(sSort){ sSort.onchange = ()=>{ state.schoolSort=sSort.value; render(); }; }

    document.querySelectorAll('.school-card').forEach(card=>{
      card.onclick = ()=>{ state.openSchool = card.dataset.key; render(); };
    });
    
    const back = document.getElementById('backToSchools');
    if(back) back.onclick = ()=>{ state.openSchool=null; render(); };
    
    const dl = document.getElementById('printSchoolBtn');
    if(dl) dl.onclick = ()=>{
      const info = uniqueSchools().find(x=>x.key===state.openSchool);
      if(info) printSchoolInfo(info);
    };
    
    const addToSchool = document.getElementById('addTeacherToSchool');
    if(addToSchool) addToSchool.onclick = ()=> {
      const info = uniqueSchools().find(x=>x.key===state.openSchool);
      openTeacherForm({id:null, brc:info.brc || 'AMBAJOGAI', school:info.school, udise:info.udise, teacher:'', status:'उपस्थित', custom:{}});
    };
    
    const toggleHide = document.getElementById('toggleSchoolHide');
    if(toggleHide) toggleHide.onclick = () => {
      if(hiddenSchools.includes(state.openSchool)){
        hiddenSchools = hiddenSchools.filter(k => k !== state.openSchool);
        showToast('शाळा आता सर्वांना दिसेल');
      } else {
        hiddenSchools.push(state.openSchool);
        showToast('शाळा लपवली गेली आहे');
      }
      localStorage.setItem('hidden-schools', JSON.stringify(hiddenSchools));
      render();
    };

    document.querySelectorAll('.edit-row').forEach(btn=>{
      btn.onclick = ()=> {
        const rec = DB.find(x=>x.id===btn.dataset.id);
        openTeacherForm(rec);
      };
    });
  }
}

/* =========================================================
   INIT
   ========================================================= */
let state = {
  tab: "dashboard",
  teacherSearch:"", teacherStatus:"", teacherBrc:"",
  teacherPage:1, pageSize:40,
  schoolSearch:"", schoolMgt:"", schoolCls:"", schoolSort:"name",
  openSchool:null
};

(async function init(){
  await loadDB();
  renderAdminArea();
  render();
  syncDB();
})();
</script>
