<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Details Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* A4 PDF Print Styles */
        @media print {
            body {
                background-color: white;
                padding: 0;
                margin: 0;
            }
            .no-print {
                display: none !important;
            }
            .print-container {
                width: 100%;
                padding: 0;
            }
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            th, td {
                border: 1px solid #333 !important;
                padding: 4px !important;
                font-size: 10px !important;
                text-align: left;
                color: black !important;
            }
            h1 {
                font-size: 16px !important;
                text-align: center;
                margin-bottom: 10px;
                color: black !important;
            }
            .group-header {
                background-color: #e5e7eb !important;
                font-weight: bold;
                text-align: center;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 print-container">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h1 class="text-3xl font-bold text-slate-700">शाळा आणि मुख्याध्यापक यादी (Ambajogai)</h1>
            <div class="no-print space-x-3">
                <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow transition">
                    + Add New School
                </button>
                <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded shadow transition">
                    🖨️ Print / Save A4 PDF
                </button>
            </div>
        </div>

        <!-- Data Table -->
        <div class="overflow-x-auto bg-white rounded-lg shadow-sm border border-slate-200 mb-10">
            <table class="min-w-full divide-y divide-slate-200 text-sm">
                <thead class="bg-slate-100">
                    <tr>
                        <th class="px-4 py-3 text-left font-semibold text-slate-600">UDISE</th>
                        <th class="px-4 py-3 text-left font-semibold text-slate-600">School Name</th>
                        <th class="px-4 py-3 text-left font-semibold text-slate-600">Management Type</th>
                        <th class="px-4 py-3 text-left font-semibold text-slate-600">Principal</th>
                        <th class="px-4 py-3 text-left font-semibold text-slate-600">Mobile</th>
                        <th class="px-4 py-3 text-center font-semibold text-slate-600 w-24 no-print">Actions</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-200">
                    <!-- Rows will be populated by JavaScript grouped by classes -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add / Edit Modal -->
    <div id="schoolModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center no-print z-50">
        <div class="bg-white rounded-lg shadow-lg w-full max-w-lg p-6">
            <h2 id="modalTitle" class="text-xl font-bold mb-4 text-slate-700">Add New School</h2>
            
            <form id="schoolForm" class="space-y-4">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">UDISE Code</label>
                        <input type="text" id="udise" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Management Type</label>
                        <select id="management" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:border-blue-500">
                            <option value="Zilla Parishad">Zilla Parishad</option>
                            <option value="Private/Other">Private/Other</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">School Name</label>
                    <input type="text" id="schoolName" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:border-blue-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-1">Classes (Group Name)</label>
                    <input type="text" id="classes" placeholder="e.g., इयत्ता १ ते ४ (Class 1 to 4)" required class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:border-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Principal Name</label>
                        <input type="text" id="principal" class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Mobile Number</label>
                        <input type="text" id="mobile" class="w-full border border-slate-300 rounded px-3 py-2 outline-none focus:border-blue-500">
                    </div>
                </div>

                <div class="flex justify-end space-x-3 mt-6 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded transition">Cancel</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded transition">Save Details</button>
                </div>
            </form>
        </div>
    </div>

        // Load schools from LocalStorage if they exist, otherwise use initial data
        const storedSchools = localStorage.getItem('schoolsDataPdf');
        if (storedSchools) {
            schools = JSON.parse(storedSchools);
        }

        // Save data to LocalStorage
        function saveData() {
            localStorage.setItem('schoolsDataPdf', JSON.stringify(schools));
        }

        // Render Table logic - Groups by 'classes' automatically
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            // Group schools by their classes string
            const groupedSchools = {};
            schools.forEach((school, index) => {
                if (!groupedSchools[school.classes]) {
                    groupedSchools[school.classes] = [];
                }
                groupedSchools[school.classes].push({ school, index });
            });

            // Loop through each group to render headers and rows
            for (const className in groupedSchools) {
                // Add group header row
                const headerTr = document.createElement('tr');
                headerTr.className = "bg-slate-200 text-slate-800 font-bold group-header border-y-2 border-slate-300";
                headerTr.innerHTML = `
                    <td colspan="6" class="px-4 py-3 text-center text-md tracking-wider">${className}</td>
                `;
                tbody.appendChild(headerTr);

                // Add school rows for this group
                groupedSchools[className].forEach(item => {
                    const school = item.school;
                    const index = item.index;
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                    tr.innerHTML = `
                        <td class="px-4 py-2 font-mono text-slate-700">${school.udise}</td>
                        <td class="px-4 py-2 font-medium text-slate-800">${school.schoolName}</td>
                        <td class="px-4 py-2">
                            <span class="px-2 py-1 rounded text-xs font-semibold ${school.management === 'Zilla Parishad' ? 'bg-orange-100 text-orange-800' : 'bg-purple-100 text-purple-800'}">
                                ${school.management}
                            </span>
                        </td>
                        <td class="px-4 py-2 text-slate-700">${school.principal}</td>
                        <td class="px-4 py-2 text-slate-700">${school.mobile}</td>
                        <td class="px-4 py-2 text-center no-print">
                            <button onclick="editSchool(${index})" class="text-blue-500 hover:text-blue-700 mr-2 font-semibold">Edit</button>
                            <button onclick="deleteSchool(${index})" class="text-red-500 hover:text-red-700 font-semibold">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        }

        // Modal Controls
        const modal = document.getElementById('schoolModal');
        const form = document.getElementById('schoolForm');

        function openModal() {
            document.getElementById('modalTitle').innerText = "Add New School";
            form.reset();
            document.getElementById('editIndex').value = "-1";
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Edit Functionality
        function editSchool(index) {
            const school = schools[index];
            document.getElementById('modalTitle').innerText = "Edit School Details";
            document.getElementById('editIndex').value = index;
            
            document.getElementById('udise').value = school.udise;
            document.getElementById('schoolName').value = school.schoolName;
            document.getElementById('classes').value = school.classes;
            document.getElementById('management').value = school.management;
            document.getElementById('principal').value = school.principal;
            document.getElementById('mobile').value = school.mobile;
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        // Delete Functionality
        function deleteSchool(index) {
            if(confirm("Are you sure you want to delete this school's details?")) {
                schools.splice(index, 1);
                saveData();
                renderTable();
            }
        }

        // Form Submit (Save / Update)
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const index = parseInt(document.getElementById('editIndex').value);
            const newSchool = {
                udise: document.getElementById('udise').value.trim(),
                schoolName: document.getElementById('schoolName').value.trim(),
                classes: document.getElementById('classes').value.trim(),
                management: document.getElementById('management').value,
                principal: document.getElementById('principal').value.trim(),
                mobile: document.getElementById('mobile').value.trim()
            };

            if (index === -1) {
                schools.push(newSchool); // Add
            } else {
                schools[index] = newSchool; // Update
            }

            saveData();
            renderTable();
            closeModal();
        });

        // Initial Render on page load
        renderTable();
    </script>
